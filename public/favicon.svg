<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background circle with smooth border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Eyewear / Lens Graphic -->
  <g transform="translate(0, 10)">
    <!-- Left Frame -->
    <circle cx="180" cy="240" r="90" fill="url(#lensGrad)" stroke="url(#goldGrad)" stroke-width="18" />
    <circle cx="180" cy="240" r="72" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3" />
    <path d="M 130 195 A 75 75 0 0 1 210 175" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.7" />

    <!-- Right Frame -->
    <circle cx="332" cy="240" r="90" fill="url(#lensGrad)" stroke="url(#goldGrad)" stroke-width="18" />
    <circle cx="332" cy="240" r="72" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3" />
    <path d="M 282 195 A 75 75 0 0 1 362 175" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.7" />

    <!-- Bridge -->
    <path d="M 270 220 Q 256 205 242 220" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Temples / Arms hints -->
    <path d="M 90 230 Q 60 225 45 200" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 422 230 Q 452 225 467 200" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Sparkle / Reflection -->
    <circle cx="215" cy="205" r="8" fill="#FFFFFF" opacity="0.9" />
    <circle cx="367" cy="205" r="8" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- ILens Stylized Text -->
  <text x="256" y="420" font-family="'Playfair Display', 'Georgia', serif" font-weight="900" font-size="64" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">iLENS</text>
</svg>
